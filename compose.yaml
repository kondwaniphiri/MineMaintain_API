services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: minemaintain
      POSTGRES_USER: minemaintain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: [CMD, pg_isready, -U, minemaintain, -d, minemaintain]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DB_HOST: db
      DB_NAME: minemaintain
      DB_USER: minemaintain
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-minemaintain-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-minemaintain-client}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      ENVIRONMENT: ${ENVIRONMENT:-local}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4).close()
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  test-db:
    profiles: [test]
    image: postgres:17
    environment:
      POSTGRES_DB: minemaintain_test
      POSTGRES_USER: minemaintain_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: [CMD, pg_isready, -U, minemaintain_test, -d, minemaintain_test]
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  postgres-data:
